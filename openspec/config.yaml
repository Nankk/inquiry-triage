schema: spec-driven

context: |
  プロジェクト: inquiry-triage。顧客問い合わせをマルチエージェントで仕分け・返信案作成し、人が承認して送る。
  用途: LLM パイプラインの設計パターン（一方向、承認ゲート、決定論的後処理）を架空の題材で示すプロトタイプ。
  見せたいのは構成（LLM とコードの線引き、追跡可能性、拡張のしやすさ）。返信品質の最適化や実運用規模は範囲外。
  設計思想: LLM に任せる部分を小さく、周囲の決定論的な仕組みを大きく。オーケストレータはコード。
  AI の自己修正ループは置かない。各段の出力は不変レコードとして保存し、人の承認だけが結果を上書きできる。
  スタック: Python 3.12+、uv、Python 側は標準ライブラリのみ（LLM 呼び出しは urllib、API は http.server）。LLM は OpenAI 互換エンドポイント。
  画面（web/）は Vite + React + TypeScript、UI ライブラリ無し。業務ロジックは Python 側に置き、画面は表示と送信だけ。
  テスト: LLM を境界として切り離し、fixture によるリプレイで API キー無しに一周させる。
  会社のコード・データ・文書は一切使わない。入力は架空データ。
  言語: ドキュメントは日本語、コードの識別子は英語。

rules:
  proposal:
    - 500 語以内。Non-goals を必ず書く
  tasks:
    - 1 タスクは 30 分以内で終わる粒度にする
